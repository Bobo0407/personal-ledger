{# 409 確認畫面（規格 9.3）。只列出 P1 回傳的待確認項目（V10、V11）；
   內容在這裡不能修改，「返回修改」回到表單，修改後重新送出會重新檢查。 #}
<div class="confirm" role="alertdialog" aria-labelledby="confirm-title">
  <h2 id="confirm-title">請確認</h2>
  <ul>
    {% for issue in pending %}
    <li data-code="{{ issue.code }}">{{ issue.message }}</li>
    {% endfor %}
  </ul>

  {% set form_url = form_url or "/txn/new" %}
  <form method="post" action="{{ form_url }}" class="stack"
        hx-post="{{ form_url }}" hx-target="#txn-area" hx-swap="innerHTML"
        hx-disabled-elt="#btn-confirm, #btn-edit">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    {% for key, value in values.items() %}
    <input type="hidden" name="{{ key }}" value="{{ value }}">
    {% endfor %}
    <input type="hidden" name="confirmed" value="{{ confirmed }}">
    <div class="actions">
      <button id="btn-confirm" type="submit" name="action" value="{{ action }}">仍要儲存</button>
      <button id="btn-edit" type="submit" name="action" value="edit" class="secondary">返回修改</button>
    </div>
  </form>
</div>
