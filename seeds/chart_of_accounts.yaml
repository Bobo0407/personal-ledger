# 正式環境的主資料初始值（P1 Step 2，2026-10-11 拍板）。
#
# 載入：python scripts/seed_master_data.py [--dry-run]
# 重複執行只會新增缺少的資料，不會覆寫你在介面上改過的名稱、排序等欄位，也不會刪除任何資料。
# 測試用的科目表另外放在 tests/fixtures/chart_of_accounts_test.yaml，改這個檔不會影響測試。
#
# 規則：
# - code 一律加引號（字串）；第 1 碼對應五大類：1 資產、2 負債、3 權益、4 收入、5 費用。
# - 子科目沿用上層的五大類，不必重寫 class；有 children 的是群組，沒有的是最末層（只有最末層可以記帳）。
# - 資產與負債必填 subtype；tax_category 只能放在最末層。
# - 第一層費用科目就是月預算的單位。
# - sort_order 省略時依清單順序。

accounts:
  # ── 資產：攤平成第一層，不預建空群組（應收款項等要用時再新增）──
  - {code: "1101", name: 現金, class: ASSET, subtype: CASH, show_on_home: true}
  - {code: "1102", name: 郵局, class: ASSET, subtype: BANK, show_on_home: true}
  - {code: "1103", name: 聯邦活存, class: ASSET, subtype: BANK, show_on_home: true}
  - {code: "1201", name: 勞退個人專戶, class: ASSET, subtype: PENSION, tax_category: PENSION_SELF}
  - {code: "1301", name: 預付所得稅, class: ASSET, subtype: PREPAID_TAX, tax_category: WITHHOLDING}

  # ── 負債 ──
  # 聯邦信用卡的結帳日、繳款日尚未確認，這裡刻意不提供 credit_card 區塊（尚未設定信用卡週期）。
  # 確認後請用信用卡設定流程建立（扣繳帳戶預定為 1103 聯邦活存，信用額度可不填）。
  - {code: "2101", name: 聯邦信用卡, class: LIABILITY, subtype: CREDIT_CARD, show_on_home: true}

  # ── 權益：系統科目，不能停用或刪除 ──
  - {code: "3101", name: 期初權益, class: EQUITY, system_key: OPENING_EQUITY}
  - {code: "3102", name: 帳務調整, class: EQUITY, system_key: ADJUSTMENT}

  # ── 收入 ──
  - code: "4100"
    name: 薪資
    class: INCOME
    children:
      - {code: "4101", name: 本薪, tax_category: SALARY}
      - {code: "4102", name: 加班費, tax_category: SALARY}
      - {code: "4103", name: 獎金, tax_category: SALARY}
  - {code: "4201", name: 利息收入, class: INCOME, tax_category: INTEREST}
  - {code: "4901", name: 其他收入, class: INCOME}

  # ── 費用（第一層 = 預算單位）──
  - code: "5100"
    name: 餐飲
    class: EXPENSE
    children:
      - {code: "5101", name: 正餐}
      - {code: "5102", name: 飲料}
      - {code: "5103", name: 點心零食}
  - code: "5200"
    name: 購物
    class: EXPENSE
    children:
      - {code: "5201", name: 網購}
      - {code: "5202", name: 日用品}
  - code: "5300"
    name: 娛樂
    class: EXPENSE
    children:
      - {code: "5301", name: 演唱會與轉播}
      - {code: "5302", name: 粉絲會費}
      - {code: "5303", name: 遊戲}
  - code: "5400"
    name: 數位訂閱
    class: EXPENSE
    children:
      - {code: "5401", name: AI 訂閱}
      - {code: "5402", name: 影音與音樂}
      - {code: "5403", name: 其他訂閱}
  - code: "5500"
    name: 金融費用
    class: EXPENSE
    children:
      - {code: "5501", name: 其他手續費}
      - {code: "5502", name: 海外交易手續費}
      - {code: "5503", name: 分期利息}
  - code: "5600"
    name: 保險
    class: EXPENSE
    children:
      - {code: "5601", name: 勞保, tax_category: INSURANCE}
      - {code: "5602", name: 健保, tax_category: INSURANCE}
  - code: "5700"
    name: 醫療
    class: EXPENSE
    children:
      - {code: "5701", name: 門診與藥品, tax_category: MEDICAL}
  - code: "5800"
    name: 交通
    class: EXPENSE
    children:
      - {code: "5801", name: 大眾運輸}
  - code: "5900"
    name: 其他
    class: EXPENSE
    children:
      - {code: "5901", name: 雜項}

# 原幣資訊用的幣別。記帳金額 postings.amount 本身就是新台幣（TWD）元，
# 所以這裡不放 TWD；original_currency 只用來記錄外幣刷卡的原幣別與原幣金額，不代表系統不支援 TWD。
currencies:
  - {code: USD, name: 美元, minor_unit: 2}
  - {code: JPY, name: 日圓, minor_unit: 0}

# 付款方式是「管道」，account 是實際扣款的帳戶（規格 6.3）。
# 預設付款方式只由 default 指定（決策 D4），全系統最多一個。
payment_methods:
  - {name: LINE Pay, account: "1102", default: true}
  - {name: 台灣Pay, account: "1102"}
  - {name: 郵局簽帳卡, account: "1102"}
  - {name: 現金, account: "1101"}
  - {name: 聯邦信用卡, account: "2101"}
  - {name: 聯邦轉帳, account: "1103"}

# 系統設定（規格 6.10）。預設付款方式不在這裡。
settings:
  large_amount_threshold: 10000
  budget_alert_pct: 80
