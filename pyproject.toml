[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger"
version = "0.1.0"
description = "以複式記帳為核心的個人財務 Web 系統"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    # 主資料初始值 seeds/*.yaml；只使用 yaml.safe_load
    "pyyaml>=6.0",
    # Windows 沒有內建 IANA 時區資料庫，zoneinfo 需要這個套件才能載入 Asia/Taipei
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Starlette TestClient 從 1.2 起支援 httpx2；用一般 httpx 會出現 deprecation warning
    "httpx2",
    "starlette>=1.2",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# 基本 lint：pycodestyle 錯誤與警告、pyflakes、import 排序
select = ["E", "W", "F", "I"]
