# Alembic config. Keep this file ASCII-only: Alembic reads it with the OS locale
# encoding (cp950 on zh-TW Windows), so non-ASCII text here breaks parsing.
# The database URL is not set here; migrations/env.py reads DATABASE_URL from app.config.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
