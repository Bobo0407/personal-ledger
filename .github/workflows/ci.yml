name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 是 pyproject 的最低版本；3.13 是目前本機開發版本
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # 備份測試要用真的 age（P3-5A）與真的 rclone（P3-5B，用它的 local backend 當「雲端」，
      # 不需要也不放任何 Google token）。沒裝成功就讓這一步失敗；測試在 CI 缺工具時也會失敗，不會 skip
      - name: Install age and rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y age rclone
          age --version
          age-keygen --version
          rclone version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        run: pytest
